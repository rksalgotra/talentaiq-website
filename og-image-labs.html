<!DOCTYPE html>
<html><head><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;background:linear-gradient(135deg,#0B1220,#1E293B 55%,#334155);font-family:system-ui,sans-serif;display:flex;align-items:center;justify-content:center;color:white}
.card{text-align:center;max-width:900px}
.logo{width:64px;height:64px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:16px;display:inline-flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;margin-bottom:24px}
h1{font-size:48px;font-weight:800;letter-spacing:-1px;margin-bottom:16px}
p{font-size:22px;opacity:.8;line-height:1.5;margin-bottom:32px}
.pills{display:flex;gap:12px;justify-content:center}
.pill{padding:8px 20px;border-radius:999px;font-size:14px;font-weight:600}
.pill.ent{background:rgba(79,70,229,.25);border:1px solid rgba(129,116,255,.4);color:#C7C4FF}
.pill.car{background:rgba(5,150,105,.25);border:1px solid rgba(52,211,153,.4);color:#A7F3D0}
.url{margin-top:32px;font-size:16px;opacity:.5;letter-spacing:1px}
</style></head><body>
<div class="card">
<div class="logo">T</div>
<h1>TalentAIQ Labs</h1>
<p>AI-native hiring infrastructure &mdash; for enterprises<br>hiring at scale, and candidates finding their next role.</p>
<div class="pills">
<span class="pill ent">TalentAIQ Enterprise</span>
<span class="pill car">TalentAIQ Career</span>
</div>
<div class="url">talentaiq.in</div>
</div>
</body></html>
